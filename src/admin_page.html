<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СБОРКА — админка</title>
<link rel="stylesheet" href="/css/app.css">
<meta name="robots" content="noindex">
<style>
  /* Только раскладка на токенах app.css; компоненты — готовые .card/.btn/.chip/.badge/.seg/.inp */
  body{background:var(--bg)}
  .adm{max-width:980px;margin:0 auto;padding:16px}
  .adm h1{font-size:19px;font-weight:800;margin:0;color:var(--navy)}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .seg{flex-wrap:wrap}
  .seg button{min-height:44px;white-space:nowrap}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
  .tools .inp{width:auto;min-width:0;flex:1 1 160px}
  .row{padding:13px 15px;margin-bottom:10px}
  .row .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
  .row .tt{font-size:14px;font-weight:700;line-height:1.4;min-width:0;overflow-wrap:anywhere}
  .row .sub{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:4px;overflow-wrap:anywhere}
  .row .when{font-size:12px;color:var(--faint);white-space:nowrap}
  .sum{font-weight:800;color:var(--amber-ink);font-variant-numeric:tabular-nums}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .acts .btn,.acts select{width:auto;margin-top:0;min-height:44px;padding:10px 14px;font-size:13.5px}
  .acts select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;font-family:inherit}
  .offs{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .off{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;padding:6px 0;font-size:13px}
  .off.won{font-weight:700}
  .b-bad{background:var(--card2);color:var(--muted)}
  .empty{text-align:center;color:var(--faint);padding:30px 0;font-size:13px}
  .err{color:var(--amber-ink);font-size:13px;margin:8px 0}
  a.lnk{color:var(--navy);font-weight:600;cursor:pointer;text-decoration:underline}

  /* ---- Дашборд: только токены app.css ---- */
  button.chip{font-family:inherit;min-height:44px}
  .kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 6px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow-sm);min-width:0}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:600}
  .kpi .v{font-size:24px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:3px;line-height:1.15;overflow-wrap:anywhere}
  .kpi .s{font-size:11.5px;color:var(--faint);margin-top:4px;line-height:1.35}
  .kpi.hero{border-color:var(--amber)}
  .kpi.hero .v{font-size:32px}
  .grp{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-size:14px}
  .grp .cnt{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--muted)}
  .grp .cnt.hot{background:var(--amber);color:#3a2405}
  .okline{font-size:13px;color:var(--muted);padding:8px 0}
  .fr{margin:10px 0}
  .fr .nm{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;margin-bottom:4px}
  .fr .nm span{color:var(--muted);font-weight:500;font-size:12px}
  .fr .trk{display:flex;align-items:center;gap:8px;height:24px}
  .fr .bar{height:24px;background:var(--navy);border-radius:0 4px 4px 0;min-width:2px}
  .fr .val{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .plot{position:relative;margin-top:6px}
  .cols{display:flex;align-items:stretch;height:130px;border-bottom:1px solid var(--line)}
  .col{flex:1 1 0;min-width:0;display:flex;align-items:flex-end;justify-content:center;padding:0 1px;cursor:default;outline-offset:-2px}
  .col .cb{width:100%;max-width:24px;background:var(--navy);border-radius:4px 4px 0 0}
  .col:hover .cb,.col:focus .cb{background:var(--navy2)}
  .xax{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px}
  .tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--card);font-size:12px;font-weight:700;padding:6px 10px;border-radius:9px;white-space:nowrap;pointer-events:none;z-index:2}
  details.how{margin:18px 0 6px;font-size:12.5px;color:var(--muted);line-height:1.55}
  details.how summary{cursor:pointer;font-weight:700;color:var(--navy);min-height:32px}
  details.how p{margin:6px 0}
</style>
</head>
<body>
<div class="adm">
  <div class="top">
    <h1>СБОРКА · админка</h1>
    <div class="seg" id="tabs">
      <button data-t="dash" class="on">Дашборд</button>
      <button data-t="journal">Журнал</button>
      <button data-t="orders">Заказы и отклики</button>
      <button data-t="masters">Мастера</button>
      <button data-t="partners">Партнёры</button>
      <button data-t="notif">Уведомления</button>
    </div>
  </div>
  <div id="err" class="err" hidden></div>
  <div id="view"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const view=$('#view');
const show=(...kids)=>view.replaceChildren(...kids.flat(Infinity).filter(c=>c&&c.nodeType));
const TZ='Asia/Yakutsk';
const fmt=d=>new Date(d).toLocaleString('ru-RU',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const rub=n=>n==null?'—':Number(n).toLocaleString('ru-RU')+' ₽';
const STATUS={open:'Поиск мастера',assigned:'Мастер назначен',agreed:'Договорились',en_route:'Мастер выехал',working:'В работе',done:'Выполнен',cancelled:'Отменён',expired:'Истёк',spam:'Спам'};
const BADGE={open:'b-new',assigned:'b-prog',agreed:'b-prog',en_route:'b-prog',working:'b-prog',done:'b-done',cancelled:'b-bad',expired:'b-bad',spam:'b-bad'};

// Все данные (имена клиентов и мастеров вводят пользователи) вставляем только как текст.
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));
  return e;
}
async function api(path,opt){
  const r=await fetch(path,{credentials:'same-origin',...(opt||{}),headers:{'content-type':'application/json'}});
  if(!r.ok){
    let m='Ошибка '+r.status;
    try{const j=await r.json();if(j&&j.error)m=j.error;}catch(e){}   // текст причины от сервера («code занят», «больше доступного»…)
    throw new Error(m);
  }
  return r.json();
}
function err(m){const e=$('#err');e.hidden=!m;e.textContent=m||'';}
const tel=p=>!p?'':(/\D/.test(p)?p:'+'+p); // у мастеров номер цифрами, у клиентов — как ввели

// ---------- Журнал ----------
const state={jf:'all',jq:'',order:null,master:null};
const KIND={
  all:()=>true,
  offer:e=>e.kind==='deal'&&/^отклик/.test(e.note||''),
  taken:e=>e.kind==='deal'&&e.to_status==='assigned',
  status:e=>e.kind==='deal'&&['agreed','en_route','working','done'].includes(e.to_status),
  cancel:e=>e.kind==='deal'&&e.to_status==='cancelled',
  other:e=>e.kind==='master_new'||(e.kind==='deal'&&(/^отзыв/.test(e.note||'')||(['assigned','agreed'].includes(e.from_status)&&e.to_status==='open'))),
};
function describe(e){
  const cl=`${e.client_name||'клиент'} ${tel(e.client_phone)}`.trim();
  const mst=e.actor_master_name||e.assigned_master_name||'мастер';
  const ord=e.order_id?`заявка #${e.order_id}`:'';
  if(e.kind==='master_new')return{t:`Мастер в системе: ${e.actor_master_name||''}`,s:`${tel(e.assigned_master_phone)} · статус: ${e.to_status}`};
  const note=e.note||'';
  if(e.actor_type==='master'&&/^отклик отозван/.test(note))return{t:`Отклик отозван — ${mst}`,s:`${ord} · ${cl}`};
  if(e.actor_type==='master'&&/^отклик/.test(note))return{t:`Отклик: ${mst} · ${note.replace(/^отклик:\s*/,'')}`,s:`${ord} · ${cl}`,sum:1};
  if(e.to_status==='assigned')return{t:`Заказ взят: ${e.assigned_master_name||'мастер'} ${tel(e.assigned_master_phone)}`,s:`${ord} · ${cl} · ${rub(e.agreed_price_rub)}${e.address?' · '+e.address:''}`};
  if(e.actor_type==='client'&&e.to_status==='agreed')return{t:'Клиент подтвердил: договорились с мастером',s:`${ord} · ${cl}`};
  if(e.actor_type==='master'&&e.to_status)return{t:`${{agreed:'Договорился с клиентом',en_route:'Выехал',working:'Приступил к работе',done:'Завершил заказ'}[e.to_status]||e.to_status} — ${mst}`,s:`${ord} · ${cl}`};
  if(e.to_status==='cancelled')return{t:'Заявка отменена клиентом',s:`${ord} · ${cl}${e.note&&e.note!=='клиент отменил'?' · '+e.note:''}`};
  if(e.actor_type==='admin')return{t:`Вы сменили статус: ${STATUS[e.to_status]||e.to_status}`,s:`${ord} · ${cl}`};
  if(/^отзыв/.test(note))return{t:`Отзыв клиента о мастере ${e.assigned_master_name||''}: ${note.replace(/^отзыв\s*/,'')}`,s:`${ord} · ${cl}`};
  if(e.actor_type==='client'&&['assigned','agreed'].includes(e.from_status)&&e.to_status==='open')return{t:'Не договорились — заявка снова в поиске',s:`${ord} · ${cl} · ${note}`};
  if(e.to_status==='open')return{t:'Новая заявка',s:`${ord} · ${cl}${e.address?' · '+e.address:''}`};
  return{t:note||`${e.from_status||''} → ${e.to_status||''}`,s:`${ord} · ${cl}`};
}
async function journal(){
  const qs=new URLSearchParams();
  if(state.order)qs.set('order_id',state.order);
  if(state.master)qs.set('master_id',state.master);
  const {events}=await api('/api/admin/journal?'+qs);
  const chips=[['all','Все'],['offer','Отклики'],['taken','Заказ взят'],['status','Выезд / работа / готово'],['cancel','Отмены'],['other','Отзывы, мастера']];
  const q=state.jq.trim().toLowerCase();
  const list=events.filter(KIND[state.jf]).map(e=>({e,d:describe(e)}))
    .filter(x=>!q||(x.d.t+' '+x.d.s).toLowerCase().includes(q));
  show(
    h('div',{class:'chips'},chips.map(([k,l])=>h('button',{class:'chip'+(state.jf===k?' on':''),onclick:()=>{state.jf=k;journal();}},l))),
    h('div',{class:'tools'},
      h('input',{class:'inp',placeholder:'Поиск: имя, телефон, № заявки',value:state.jq,oninput:ev=>{state.jq=ev.target.value;state.foc=true;clearTimeout(state.t);state.t=setTimeout(journal,250);}}),
      (state.order||state.master)&&h('button',{class:'btn ghost',style:'width:auto;margin:0',onclick:()=>{state.order=state.master=null;journal();}},'Сбросить фильтр'),
      h('button',{class:'btn ghost',style:'width:auto;margin:0',onclick:journal},'Обновить')),
    list.length?list.map(({e,d})=>h('div',{class:'card row'},
      h('div',{class:'hd'},h('div',{class:'tt'+(d.sum?' sum':'')},d.t),h('div',{class:'when'},fmt(e.at))),
      h('div',{class:'sub'},d.s,e.order_id&&h('span',null,' · ',h('a',{class:'lnk',onclick:()=>{state.order=e.order_id;state.master=null;journal();}},'вся история заявки'))))):h('div',{class:'empty'},'Событий нет')
  );
  if(state.foc){state.foc=false;const i=view.querySelector('input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
}

// ---------- Заказы и отклики ----------
async function orders(){
  const {orders:list}=await api('/api/admin/orders-full');
  show(h('div',{class:'tools'},h('button',{class:'btn ghost',style:'width:auto;margin:0',onclick:orders},'Обновить')),
    list.length?list.map(o=>{
      const sel=h('select',null,h('option',{value:''},'Сменить статус…'),Object.entries(STATUS).map(([k,l])=>h('option',{value:k},l)));
      sel.onchange=async()=>{
        if(!sel.value)return;
        if(!confirm(`Заявка #${o.id}: поставить статус «${STATUS[sel.value]}»?\nМастеру и клиенту уведомление не уйдёт.`)){sel.value='';return;}
        try{await api(`/api/admin/orders/${o.id}/status`,{method:'POST',body:JSON.stringify({status:sel.value})});orders();}catch(x){err(x.message);}
      };
      return h('div',{class:'card row'},
        h('div',{class:'hd'},h('div',{class:'tt'},`#${o.id} · ${o.name} ${tel(o.phone)}`),h('span',{class:'badge '+(BADGE[o.status]||'b-bad')},STATUS[o.status]||o.status)),
        h('div',{class:'sub'},fmt(o.created_at),o.address&&` · ${o.address}`,` · бюджет ${rub(o.budget_rub)}`,o.calc_low&&` · расчёт ${rub(o.calc_low)}–${rub(o.calc_high)}`,o.ref&&` · партнёр ${o.ref}`),
        o.master_name&&h('div',{class:'sub'},'Мастер: ',h('b',null,o.master_name),` ${tel(o.master_phone)} · сумма `,h('span',{class:'sum'},rub(o.agreed_price_rub)),` · комиссия ${rub(o.commission_rub)}`),
        h('div',{class:'offs'},o.offers.length?[h('div',{class:'sub',style:'margin:0 0 4px'},`Отклики: ${o.offers.length}`),
          o.offers.map(f=>h('div',{class:'off'+(f.status==='accepted'?' won':'')},
            h('span',null,f.master_name,f.verified?' ✓':'',` ${tel(f.master_phone)}`,f.note&&` — «${f.note}»`),
            h('span',null,h('span',{class:'sum'},rub(f.price)),` · ${{active:'ждёт выбора',accepted:'выбран',rejected:'не выбран',declined:'не договорились',withdrawn:'отозван',expired:'истёк'}[f.status]||f.status} · ${fmt(f.at)}`)))]:h('div',{class:'sub',style:'margin:0'},'Откликов пока нет')),
        h('div',{class:'acts'},h('button',{class:'btn ghost',onclick:()=>{state.order=o.id;state.master=null;setTab('journal');}},'История заявки'),sel));
    }):h('div',{class:'empty'},'Заказов нет'));
}

// ---------- Мастера ----------
// Карточка со ссылкой-приглашением: ссылка, QR-код (PNG с сервера), «Отправить…»/«Скачать QR»,
// готовый текст сообщения. Ссылки строятся от адреса сайта, который отдаёт сервер (PUBLIC_BASE_URL).
function inviteCard(o){
  const qr='/api/admin/qr.png?u='+encodeURIComponent(o.url);
  const msg=`${o.hello||'Приглашаю вас в СБОРКУ — заявки на сборку мебели в Якутске.'} Регистрация мастера: ${o.url}`;
  const flash=(btn,t)=>{const old=btn.textContent;btn.textContent=t;setTimeout(()=>{btn.textContent=old;},1800);};
  const copyText=async(btn,text)=>{try{await navigator.clipboard.writeText(text);flash(btn,'Скопировано');}catch(e){flash(btn,'Скопируйте вручную');}};
  const linkInp=h('input',{class:'inp',readonly:true,value:o.url,style:'flex:1 1 220px;min-width:0',onfocus:e=>e.target.select()});
  const cpLink=h('button',{type:'button',class:'btn ghost',style:'width:auto;margin:0',onclick:()=>copyText(cpLink,o.url)},'Скопировать ссылку');
  const cpMsg=h('button',{type:'button',class:'btn ghost',onclick:()=>copyText(cpMsg,msg)},'Скопировать сообщение');
  const save=h('a',{class:'btn navy',href:qr,download:o.file||'sborka-invite.png',style:'text-decoration:none;display:inline-flex;align-items:center;justify-content:center'},'Скачать QR-код');
  // «Отправить…» — системное окно «Поделиться» (Telegram, WhatsApp, почта…) сразу с картинкой QR и текстом
  const share=navigator.share?h('button',{type:'button',class:'btn primary',onclick:async()=>{
    try{
      err('');
      const r=await fetch(qr,{credentials:'same-origin'});
      if(!r.ok)throw new Error('Не удалось создать QR-код');
      const file=new File([await r.blob()],o.file||'sborka-invite.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],text:msg});
      else await navigator.share({text:msg});
    }catch(x){if(x.name!=='AbortError')err(x.message);}
  }},'Отправить…'):null;
  return h('div',{class:'card row',style:'border-color:var(--amber)'},
    h('div',{class:'hd'},h('div',{class:'tt'},o.title),o.onClose&&h('button',{type:'button',class:'btn ghost',style:'width:auto;margin:0;min-height:44px',onclick:o.onClose},'Скрыть')),
    o.note&&h('div',{class:'sub'},o.note),
    h('div',{class:'tools'},linkInp,cpLink),
    h('div',{style:'display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:10px'},
      h('img',{src:qr,alt:'QR-код приглашения',width:200,height:200,style:'border-radius:12px;border:1px solid var(--line)'}),
      h('div',{class:'acts',style:'flex-direction:column;align-items:stretch;margin:0'},share,save,cpMsg)));
}
async function masters(){
  err('');
  const [{masters:list},jn]=await Promise.all([api('/api/admin/masters'),api('/api/admin/master-join')]);
  const st={active:'Активен',suspended:'Заблокирован',invited:'Приглашён',pending:'На модерации'};
  const fName=h('input',{class:'inp',placeholder:'Как зовут мастера',value:state.invName||'',oninput:e=>{state.invName=e.target.value;}});
  const fPhone=h('input',{class:'inp',type:'tel',placeholder:'+7 ___ ___-__-__',value:state.invPhone||'',oninput:e=>{state.invPhone=e.target.value;}});
  const field=(l,i)=>h('div',{class:'field'},h('label',null,l),i);
  const create=async()=>{
    try{
      err('');
      const name=fName.value.trim();
      const r=await api('/api/admin/masters/invite',{method:'POST',body:JSON.stringify({name,phone:fPhone.value})});
      state.inviteResult={title:`Приглашение для ${name}`,url:jn.base+r.invite_url,file:`sborka-invite-master-${r.master_id}.png`,
        hello:`${name}, приглашаю вас в СБОРКУ — заявки на сборку мебели в Якутске.`,
        note:'Ссылка одноразовая: перестанет работать, как только мастер зайдёт по ней и задаст пароль. QR-код ведёт на ту же ссылку.'};
      state.invName=state.invPhone='';
      masters();
    }catch(x){err(x.message);}
  };
  show(
    h('div',{class:'eyebrow'},'Пригласить мастера'),
    h('div',{class:'card row'},
      h('div',{class:'sub',style:'margin:0 0 8px'},'Укажите имя и телефон — получите одноразовую ссылку и QR-код: их можно сохранить или сразу отправить мастеру.'),
      field('Имя',fName),field('Телефон',fPhone),
      h('button',{type:'button',class:'btn primary',onclick:create},'Создать приглашение')),
    state.inviteResult&&inviteCard({...state.inviteResult,onClose:()=>{state.inviteResult=null;masters();}}),
    h('details',{class:'how'},h('summary',null,'Общая ссылка регистрации (для всех мастеров сразу)'),
      jn.join_url
        ?inviteCard({title:'Общая ссылка регистрации',url:jn.join_url,file:'sborka-master-join.png',
          note:'Любой, у кого есть эта ссылка или QR, может зарегистрироваться мастером и сразу увидит заявки. Отправляйте только тем, кому доверяете. Чтобы отозвать: смените MASTER_JOIN_CODE в файле .env и перезапустите сервис — старая ссылка перестанет работать.'})
        :h('div',{class:'sub'},'Общая ссылка не настроена: задайте MASTER_JOIN_CODE в файле .env.')),
    h('div',{class:'eyebrow',style:'margin-top:20px'},'Мастера'),
    h('div',{class:'tools'},h('button',{type:'button',class:'btn ghost',style:'width:auto;margin:0',onclick:masters},'Обновить')),
    list.map(m=>[h('div',{class:'card row'},
      h('div',{class:'hd'},h('div',{class:'tt'},m.name,m.verified&&' ✓'),h('span',{class:'badge '+(m.status==='active'?'b-done':m.status==='suspended'?'b-bad':'b-prog')},st[m.status]||m.status)),
      h('div',{class:'sub'},tel(m.phone),` · с ${fmt(m.created_at)} · выполнено: ${m.orders_done} · рейтинг ${Number(m.rating_avg).toFixed(1)} (${m.rating_count}) · документов: ${m.documents_count} · переходов по его ссылке клиентам: ${m.ref_clicks}`),
      h('div',{class:'acts'},

state.days=30;
const dur=min=>{
  if(min==null)return '—';
  min=Math.max(0,Math.round(min));
  if(min<60)return min+' мин';
  const hr=Math.floor(min/60);
  if(hr<24)return hr+' ч'+(min%60?' '+(min%60)+' мин':'');
  return Math.floor(hr/24)+' дн'+(hr%24?' '+(hr%24)+' ч':'');
};
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
const num1=n=>n==null?'—':Number(n).toLocaleString('ru-RU',{maximumFractionDigits:1});
const plural=(n,[a,b,c])=>{const t=n%100,u=n%10;return n+' '+((t>10&&t<15)?c:u===1?a:(u>1&&u<5)?b:c);};
const dm=day=>new Date(day+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const tile=(l,v,s,cls)=>h('div',{class:'kpi'+(cls?' '+cls:'')},h('div',{class:'l'},l),h('div',{class:'v'},v),s&&h('div',{class:'s'},s));

function waitBadge(since,lim){

function dayChart(rows){
  const max=Math.max(1,...rows.map(r=>r.n));
  const plot=h('div',{class:'plot'});
  const tip=h('div',{class:'tip',hidden:true});
  const label=r=>`${dm(r.day)} — ${plural(r.n,['заявка','заявки','заявок'])}`;
  const cols=rows.map(r=>{
    const col=h('div',{class:'col',tabindex:rows.length<=31?'0':null,'aria-label':label(r)},
      h('div',{class:'cb',style:`height:${r.n?Math.max(3,r.n/max*100):0}%`}));
    const on=()=>{tip.textContent=label(r);tip.style.left=(col.offsetLeft+col.offsetWidth/2)+'px';tip.hidden=false;};
    const off=()=>{tip.hidden=true;};
    col.onpointerenter=on;col.onfocus=on;col.onpointerleave=off;col.onblur=off;
    return col;
  });
  plot.append(tip,h('div',{class:'cols'},cols),h('div',{class:'xax'},h('span',null,dm(rows[0].day)),h('span',null,dm(rows[rows.length-1].day))));
  return h('div',null,
    h('div',{class:'sub',style:'margin:0'},`Заявок за день, максимум: ${max}`),plot,
    h('details',{class:'how'},h('summary',null,'Таблица по дням'),rows.map(r=>h('div',{class:'off'},h('span',null,dm(r.day)),h('b',null,r.n)))));
}

    h('div',{class:'kgrid'},
      tile('Заявки без откликов',k.no_offer_pct==null?'—':k.no_offer_pct+'%',`${k.no_offer} из ${k.orders}`),
      tile('До первого отклика',dur(k.median_first_min),'типичное время (медиана)'),
      tile('Откликов на заявку',num1(k.offers_per_order),'в среднем'),
      tile('Мастера',`${k.masters_offered} из ${k.masters_active}`,'откликались за период / активных всего')),

    h('details',{class:'how'},h('summary',null,'Как считаем'),
      h('p',null,'Все показатели периода считаются по заявкам, созданным в этом периоде, — так воронка и деньги сходятся между собой. Спам не учитывается. Сутки — по времени Якутска.'),
      h('p',null,'Моя прибыль = комиссия платформы (30% от цены мастера) минус доля партнёра, по выполненным заказам. Процент — от суммы выполненных заказов. Расходы (реклама, налоги, сервер, уведомления) сюда не входят — это прибыль до расходов.'),
      h('p',null,'Средний чек — средняя цена мастера по сделкам, где мастер выбран и заказ не отменён. Блок «Требует внимания» показывает состояние прямо сейчас и от периода не зависит; пороги «ждёт долго» — 2 и 12 ч для заявок без откликов, 6 и 24 ч для невыбранных, 24 и 72 ч для зависших сделок.')));
}

const TABS={dash,journal,orders,masters,partners,notif};
function setTab(t){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  err('');show(h('div',{class:'empty'},'Загрузка…'));
  TABS[t]().catch(x=>err(x.message));
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.t==='journal'){state.order=state.master=null;}setTab(b.dataset.t);});
setTab('dash');
// Автообновление каждые 15 с для текущей вкладки (и сразу при возвращении на страницу).
// Не трогаем, пока вы вводите текст / выбираете из списка, открыт раскрывающийся блок
// («Добавить партнёра», «Как считаем», «Таблица по дням») или идёт поиск в журнале —
// иначе обновление стёрло бы введённое.
function autoRefresh(){
  if(document.hidden)return;
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  if(document.querySelector('details[open]'))return;
  const t=document.querySelector('#tabs .on').dataset.t;
  if(t==='journal'&&state.jq)return;
  TABS[t]().catch(()=>{});
}
setInterval(autoRefresh,15000);
document.addEventListener('visibilitychange',autoRefresh);
</script>
</body>
